<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Logo Maharbal</title>
  <desc id="description">Monogramme M doré avec un symbole de conversation, adapté à un assistant historique.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171d22"/>
      <stop offset="1" stop-color="#090d10"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7df9f"/>
      <stop offset="0.25" stop-color="#d7a75a"/>
      <stop offset="0.55" stop-color="#8d5325"/>
      <stop offset="0.8" stop-color="#f0c775"/>
      <stop offset="1" stop-color="#7a4324"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#69d2ff"/>
      <stop offset="1" stop-color="#3b8ec6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="246" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="url(#gold)" stroke-width="8"/>

  <g filter="url(#shadow)">
    <path d="M132 332V180c0-18 14-32 32-32h36l56 77 56-77h36c18 0 32 14 32 32v152c0 18-14 32-32 32H332c-18 0-32-14-32-32V253l-44 61-44-61v79c0 18-14 32-32 32H164c-18 0-32-14-32-32z" fill="url(#gold)"/>
    <path d="M164 332V126c0-18 14-32 32-32h39l41 57 41-57h39c18 0 32 14 32 32v206" fill="none" stroke="#f9e7b6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <path d="M165 314h182" stroke="#17232b" stroke-width="12" stroke-linecap="round" opacity="0.65"/>
    <circle cx="390" cy="170" r="40" fill="url(#accent)"/>
    <path d="M374 170h32M390 154v32" stroke="#0f1b22" stroke-width="8" stroke-linecap="round"/>
  </g>
